<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SoChat</title>
  <link rel="stylesheet" href="style.css">
  <!-- hCaptcha 脚本 -->
  <script src="https://js.hcaptcha.com/1/api.js?onload=onHcaptchaLoad&render=explicit" async defer></script>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- 全局加载遮罩 (用于验证和初始化) -->
  <div id="loading-overlay" class="overlay">
    <div class="spinner"></div>
    <p id="loading-text">正在验证身份，请稍候…</p>
  </div>

  <div id="app">
    <!-- 侧边栏 (预留多房间扩展) -->
    <aside class="sidebar">
      <div class="brand">SoChat</div>
      <nav class="room-list">
        <div class="room-item active"># 公共大厅 (general)</div>
        <!-- 未来可扩展更多房间 -->
      </nav>
      <div class="user-profile">
        <div class="avatar" id="user-avatar">匿</div>
        <div class="info">
          <div class="name" id="user-name">未设置昵称</div>
          <div class="badge" id="user-role">匿名访客</div>
        </div>
      </div>
    </aside>

    <!-- 主聊天区 -->
    <main class="chat-container">
      <header class="chat-header">
        <h2># 公共大厅</h2>
        <div class="connection-status" id="conn-status">连接中...</div>
      </header>

      <!-- 消息列表 -->
      <div class="messages" id="messages-container">
        <!-- 消息将通过 JS 注入这里 -->
      </div>

      <!-- 输入区 -->
      <footer class="composer">
        <div class="input-actions">
          <!-- 图片上传按钮 -->
          <button id="btn-upload-image" class="icon-btn" title="发送图片 (上限 10MB)">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
          </button>
          <input type="file" id="file-image" accept="image/*" style="display:none;">
          
          <!-- 文件上传按钮 -->
          <button id="btn-upload-file" class="icon-btn" title="发送文件 (上限 50MB, 禁止图片)">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
          </button>
          <input type="file" id="file-doc" accept=".txt,.md,.zip,.7z,.pdf,.doc,.docx" style="display:none;">
        </div>

        <input type="text" id="chat-input" placeholder="输入消息，按 Enter 发送..." maxlength="2000" autocomplete="off" disabled>
        <button id="btn-send" disabled>发送</button>
      </footer>
    </main>
  </div>

  <!-- 提示弹窗 (Toast) -->
  <div id="toast" class="toast"></div>

  <!-- hCaptcha 隐形容器 -->
  <div id="hcaptcha-container" style="display:none;"></div>

  <script src="app.js"></script>
</body>
</html>
